{% extends 'base.html' %}{% block content %}<h1>My focus sessions</h1><p class="muted">Your saved sessions on this computer.</p><section class="card"><div class="table-wrap"><table><thead><tr><th>Domain</th><th>Minutes</th><th>Sessions</th></tr></thead><tbody>{% for item in items %}<tr><td>{{ item.domain }}</td><td>{{ item.minutes }}</td><td>{{ item.count }}</td></tr>{% else %}<tr><td colspan="3">Start a session in the extension to see your statistics.</td></tr>{% endfor %}</tbody></table></div></section>{% endblock %}
